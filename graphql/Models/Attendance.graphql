type Attendance {
    id: ID!
    date: DateTime
    user: User! @belongsTo

    am_time_in: DateTime
    am_time_out: DateTime
    pm_time_in: DateTime
    pm_time_out: DateTime

    extra_time_in_1: DateTime
    extra_time_out_1: DateTime
    extra_time_in_2: DateTime
    extra_time_out_2: DateTime

    created_at: DateTime!
    updated_at: DateTime!
}

type DTRReport {
    user: User!
    total_hours: Float!
    normal_hours: Float!
    extra_hours: Float
    salary: Float!
    total_working_days: Int!
    attendances: [Attendance!]!
}

type DailyTimeRecordPaginator {
    data: [DTRReport!]!
    paginatorInfo: PaginatorInfo!
}

input AttendanceInput {
    id: ID
    date: DateTime
    user: ConnectUserRelation

    am_time_in: DateTime
    am_time_out: DateTime
    pm_time_in: DateTime
    pm_time_out: DateTime

    extra_time_in_1: DateTime
    extra_time_out_1: DateTime
    extra_time_in_2: DateTime
    extra_time_out_2: DateTime
}

input ConnectAttendanceRelation {
    id: ID
    connect: ID
    sync: ID
    upsert: AttendanceInput
    delete: ID
}

input FilterDtr {
    key: String
    value: [String]
}

extend type Query {
    attendances: [Attendance]! @all
    attendancePaginate(
        first: Int!
        page: Int
        search: String @scope(name: "search")
        sort: SortInput @scope(name: "sort")
        filter: [FilterInput] @scope(name: "filter")
        where: _ @whereConditions(columns: ["date", "created_at"])
    ): [Attendance]! @paginate
    attendanceByDate(
        user_id: ID!,
        date: String!
    ): Attendance @field(resolver: "App\\GraphQL\\Queries\\AttendanceQuery@byDate")
    dailyTimeRecord(
        filter: [FilterDtr]
        start: DateTime!
        end: DateTime!
    ): [DTRReport]!
    @field(resolver: "App\\GraphQL\\Queries\\AttendanceQuery@dailyTimeRecord")
}

extend type Mutation @guard {
    upsertAttendance(input: AttendanceInput! @spread): Attendance! @upsert
    deleteAttendance(id: [ID!] @eq): [Attendance] @delete
}
